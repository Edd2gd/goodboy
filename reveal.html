<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good boy</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a24;
    --text: #f4f1ea;
    --muted: #9aa0ae;
    --accent: #ffc14d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.25rem;
    gap: 1.5rem;
  }
  .pup { font-size: clamp(3rem, 14vw, 5rem); animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }
  h1 { font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .18em; margin: 0; }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(3rem, 18vw, 6.5rem);
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--accent);
    background: rgba(255, 193, 77, .08);
    border: 2px dashed rgba(255, 193, 77, .45);
    border-radius: 18px;
    padding: .55em .7em .5em;
    margin: 0;
    user-select: all;
    text-shadow: 0 0 40px rgba(255, 193, 77, .35);
  }
  .note { color: var(--muted); font-size: 1rem; margin: 0; max-width: 22rem; line-height: 1.5; }
  button {
    font: inherit; font-size: .95rem; font-weight: 600;
    color: var(--muted); background: transparent;
    border: 1px solid #2c3140; border-radius: 999px;
    padding: .6rem 1.3rem; cursor: pointer;
  }
  button:hover { color: var(--text); border-color: #454c5e; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <div class="pup">🐶</div>
  <h1>You're a good boy.</h1>
  <p class="label">Final fragment</p>
  <p class="code" id="code">BX6J</p>
  <p class="note">Put it together with the other pieces to claim your voucher.</p>
  <button id="copy">Copy code</button>

<script>
  var btn = document.getElementById('copy');
  btn.addEventListener('click', function () {
    var text = document.getElementById('code').textContent.trim();
    function ok() { btn.textContent = 'Copied ✓'; setTimeout(function(){ btn.textContent = 'Copy code'; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { btn.textContent = 'Select it above'; });
    } else {
      btn.textContent = 'Select it above';
    }
  });
</script>
</body>
</html>
